<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <title>{% block title %}溫濕度監測系統{% endblock %}</title>
    {% block extra_head %}{% endblock %}
    <style>
        :root {
            --brand: #4f46e5;
            --brand-dark: #3730a3;
            --brand-soft: #eef0fe;
            --bg: #f7f8fb;
            --text-muted: #6b7280;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg);
            color: #1f2430;
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .navbar-brand .bi {
            color: var(--brand);
        }
        .navbar {
            background-color: #fff !important;
            box-shadow: 0 1px 3px rgba(17, 24, 39, 0.06);
        }
        .nav-link {
            font-weight: 500;
            color: #4b5563 !important;
            border-radius: 0.5rem;
            padding: 0.5rem 0.9rem !important;
            transition: all 0.15s ease-in-out;
        }
        .nav-link:hover {
            color: var(--brand) !important;
            background-color: var(--brand-soft);
        }
        .nav-link.active {
            color: var(--brand) !important;
            background-color: var(--brand-soft);
        }
        .btn-primary {
            background-color: var(--brand);
            border-color: var(--brand);
            font-weight: 600;
        }
        .btn-primary:hover {
            background-color: var(--brand-dark);
            border-color: var(--brand-dark);
        }
        .btn-outline-primary {
            color: var(--brand);
            border-color: var(--brand);
            font-weight: 600;
        }
        .btn-outline-primary:hover {
            background-color: var(--brand);
            border-color: var(--brand);
        }
        .card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 4px 16px rgba(17, 24, 39, 0.06);
        }
        .page-title {
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .page-subtitle {
            color: var(--text-muted);
        }
        .badge-soft {
            background-color: var(--brand-soft);
            color: var(--brand);
            font-weight: 600;
        }
        footer {
            color: var(--text-muted);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-md sticky-top py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{% url 'view_history_temperature' %}">
                <i class="bi bi-thermometer-half fs-4"></i>
                <span>溫濕度監測系統</span>
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto gap-1">
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'history' %}active{% endif %}" href="{% url 'view_history_temperature' %}">歷史紀錄</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'add' %}active{% endif %}" href="{% url 'add_temperature' %}">新增資料</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'show1' %}active{% endif %}" href="{% url 'show_temperature1' %}">即時顯示 1</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active == 'show2' %}active{% endif %}" href="{% url 'show_temperature2' %}">即時顯示 2</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4">
        <div class="container">
            &copy; 2024 <a href="#" class="text-decoration-none">tony yeh</a>. All rights reserved.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
