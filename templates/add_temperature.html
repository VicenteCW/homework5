{% extends 'base.html' %}
{% block title %}新增溫濕度資料 | 溫濕度監測系統{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="text-center mb-4">
            <span class="badge badge-soft rounded-pill px-3 py-2 mb-2">新增資料</span>
            <h1 class="page-title h2 mt-2">新增溫濕度紀錄</h1>
            <p class="page-subtitle">輸入感測器讀數，建立一筆新的溫濕度資料</p>
        </div>
        <div class="card p-4 p-md-5">
            <form action="{% url 'add_temperature' %}" method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="sensor_id" class="form-label fw-semibold">Sensor ID</label>
                    <input type="text" class="form-control form-control-lg" id="sensor_id" name="sensor_id" required placeholder="輸入感測器ID">
                </div>
                <div class="mb-3">
                    <label for="temperature" class="form-label fw-semibold">溫度 (°C)</label>
                    <input type="text" class="form-control form-control-lg" id="temperature" name="temperature" required placeholder="輸入溫度">
                </div>
                <div class="mb-4">
                    <label for="humidity" class="form-label fw-semibold">濕度 (%)</label>
                    <input type="text" class="form-control form-control-lg" id="humidity" name="humidity" required placeholder="輸入濕度">
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg flex-fill">送出新增</button>
                    <a href="{% url 'view_history_temperature' %}" class="btn btn-outline-secondary btn-lg">取消</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
