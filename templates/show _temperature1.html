{% extends 'base.html' %}
{% block title %}即時溫濕度顯示 | 溫濕度監測系統{% endblock %}
{% block extra_head %}
<meta http-equiv="refresh" content="10">
{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="text-center mb-4">
            <span class="badge badge-soft rounded-pill px-3 py-2 mb-2">即時顯示</span>
            <h1 class="page-title h2 mt-2">目前溫濕度</h1>
            <p class="page-subtitle">頁面每 10 秒自動整頁刷新一次</p>
        </div>
        <div class="row g-4">
            <div class="col-sm-6">
                <div class="card text-center p-4 h-100">
                    <i class="bi bi-thermometer-half fs-1 text-primary mb-2"></i>
                    <div class="page-subtitle small mb-1">目前溫度</div>
                    <div class="fs-2 fw-bold">{{ data.temperature }}<span class="fs-5 text-muted"> °C</span></div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="card text-center p-4 h-100">
                    <i class="bi bi-droplet-half fs-1 text-primary mb-2"></i>
                    <div class="page-subtitle small mb-1">目前濕度</div>
                    <div class="fs-2 fw-bold">{{ data.humidity }}<span class="fs-5 text-muted"> %</span></div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
