{% extends 'base.html' %}
{% block title %}即時溫濕度顯示 2 | 溫濕度監測系統{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="text-center mb-4">
            <span class="badge badge-soft rounded-pill px-3 py-2 mb-2">即時顯示</span>
            <h1 class="page-title h2 mt-2">目前溫濕度</h1>
            <p class="page-subtitle">資料透過 AJAX 自動更新，無需整頁刷新</p>
        </div>
        <div class="row g-4">
            <div class="col-sm-6">
                <div class="card text-center p-4 h-100">
                    <i class="bi bi-thermometer-half fs-1 text-primary mb-2"></i>
                    <div class="page-subtitle small mb-1">目前溫度</div>
                    <div class="fs-2 fw-bold">
                        <input type="text" id="temperature" value="" disabled
                               class="form-control-plaintext text-center fs-2 fw-bold p-0">
                        <span class="fs-5 text-muted">°C</span>
                    </div>
                </div>
            </div>
            <div class="col-sm-6">
                <div class="card text-center p-4 h-100">
                    <i class="bi bi-droplet-half fs-1 text-primary mb-2"></i>
                    <div class="page-subtitle small mb-1">目前濕度</div>
                    <div class="fs-2 fw-bold">
                        <input type="text" id="humidity" value="" disabled
                               class="form-control-plaintext text-center fs-2 fw-bold p-0">
                        <span class="fs-5 text-muted">%</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <span class="badge bg-light text-secondary border rounded-pill px-3 py-2 panel_time">10秒後更新</span>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script>
    $(function () {
        refresh();
        setInterval(countdown, 1000);
    });

    var timer = 10;
    function countdown() {
        timer--;
        if (timer <= 0) {
            timer = 10;
            refresh();
        }
        $(".panel_time").text(timer + "秒後更新");
    }

    function refresh() {
        $.get("/show_temperature_API/", function (data) {
            if (data.length > 0) {
                $("#temperature").val(data[0].temperature);
                $("#humidity").val(data[0].humidity);
            }
        }).fail(function () {
            $("#temperature").val("");
            $("#humidity").val("");
        });
    }
</script>
{% endblock %}
